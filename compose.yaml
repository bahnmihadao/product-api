services:
  nammongodb:
    image: mongo:8.0
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api:
    build: .
    image: product-api:local
    container_name: product-api
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      nammongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongodb_data:
    name: nammongodb_data
