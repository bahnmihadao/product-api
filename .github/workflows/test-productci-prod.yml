name: Product CI Production Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-crud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create Docker test environment
        shell: bash
        run: |
          printf 'PORT=3000\nMONGODB_URI=mongodb://nammongodb:27017/productdb\n' > .env.docker

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Create external MongoDB volume
        run: docker volume create nammongodb_data

      - name: Build and start production-like stack
        run: docker compose up -d --build

      - name: Wait for healthy services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            mongo_status=$(docker inspect --format '{{.State.Health.Status}}' nammongodb 2>/dev/null || true)
            api_status=$(docker inspect --format '{{.State.Health.Status}}' product-api 2>/dev/null || true)
            echo "attempt=${attempt} mongo=${mongo_status:-missing} api=${api_status:-missing}"

            if [ "$mongo_status" = "healthy" ] && [ "$api_status" = "healthy" ]; then
              exit 0
            fi

            if [ "$mongo_status" = "unhealthy" ] || [ "$api_status" = "unhealthy" ]; then
              docker compose ps
              exit 1
            fi

            sleep 2
          done

          docker compose ps
          exit 1

      - name: Test API health
        run: curl --fail --silent --show-error http://127.0.0.1:3000/health

      - name: Test Product CRUD through running containers
        shell: bash
        run: |
          set -euo pipefail
          pid="CI-${GITHUB_RUN_ID}"
          base_url="http://127.0.0.1:3000/products"

          curl --fail --silent --show-error \
            -X POST "$base_url" \
            -H 'Content-Type: application/json' \
            -d "{\"pid\":\"$pid\",\"pname\":\"CI Product\",\"price\":150000,\"quantity\":10}"

          curl --fail --silent --show-error "$base_url/$pid"

          curl --fail --silent --show-error \
            -X PUT "$base_url/$pid" \
            -H 'Content-Type: application/json' \
            -d '{"pname":"Updated CI Product","price":175000,"quantity":8}'

          curl --fail --silent --show-error \
            -X DELETE "$base_url/$pid" \
            -o /dev/null

          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base_url/$pid")
          test "$status" = "404"

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop production-like stack
        if: always()
        run: docker compose down --remove-orphans
