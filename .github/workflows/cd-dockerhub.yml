name: CD - Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/product-api

jobs:
  healthcheck:
    name: Verify production image health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create Docker test environment
        shell: bash
        run: |
          printf 'PORT=3000\nMONGODB_URI=mongodb://nammongodb:27017/productdb\n' > .env.docker

      - name: Create external MongoDB volume
        run: docker volume create nammongodb_data

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for healthchecks
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            mongo_status=$(docker inspect --format '{{.State.Health.Status}}' nammongodb 2>/dev/null || true)
            api_status=$(docker inspect --format '{{.State.Health.Status}}' product-api 2>/dev/null || true)
            echo "attempt=${attempt} mongo=${mongo_status:-missing} api=${api_status:-missing}"

            if [ "$mongo_status" = "healthy" ] && [ "$api_status" = "healthy" ]; then
              exit 0
            fi

            if [ "$mongo_status" = "unhealthy" ] || [ "$api_status" = "unhealthy" ]; then
              exit 1
            fi

            sleep 2
          done

          exit 1

      - name: Verify API health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:3000/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop verification stack
        if: always()
        run: docker compose down --remove-orphans

  publish:
    name: Push image to Docker Hub
    if: github.event_name == 'push'
    needs: healthcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
